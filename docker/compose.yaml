name: flightdeck

# Demo stack: control plane + web UI + agent + a labelled sample service.
# Flightdeck's own services are labelled too, so the UI shows it monitoring
# itself (dogfooding). Run with:  just demo
# (or: docker compose -f docker/compose.yaml up --build)

services:
  control-plane:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control-plane
    labels:
      flightdeck.enable: 'true'
      flightdeck.service: 'control-plane'
      flightdeck.repo: '0xheartcode/Flightdeck'
    environment:
      # Required: compose fails fast if unset (no insecure default token).
      FD_AGENT_TOKEN: ${FD_AGENT_TOKEN:?set FD_AGENT_TOKEN in your .env}
      FD_DASHBOARD_TOKEN: ${FD_DASHBOARD_TOKEN:-}
      FD_CORS_ORIGIN: ${FD_CORS_ORIGIN:-http://localhost:8080}
      FD_CONTROL_PLANE_PORT: '4000'
      FD_LOG_BUFFER_SIZE: ${FD_LOG_BUFFER_SIZE:-2000}
      # Deployment tier: lite | medium | full (unset = base defaults). Sets the
      # feature-flag defaults; any explicit FD_* below still overrides it.
      FD_PROFILE: ${FD_PROFILE:-}
      # FULL tier only: point these at the postgres (below, --profile full) and
      # a Loki endpoint (e.g. the flightdeck-watcher stack). Empty on lite/medium.
      FD_DATABASE_URL: ${FD_DATABASE_URL:-}
      FD_LOKI_URL: ${FD_LOKI_URL:-}
    ports:
      - '4000:4000'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    labels:
      flightdeck.enable: 'true'
      flightdeck.service: 'web'
      flightdeck.repo: '0xheartcode/Flightdeck'
    ports:
      - '8080:80'
    depends_on:
      - control-plane
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    labels:
      flightdeck.enable: 'true'
      flightdeck.service: 'agent'
      flightdeck.repo: '0xheartcode/Flightdeck'
    environment:
      FD_CONTROL_PLANE_URL: ws://control-plane:4000/agent
      FD_AGENT_TOKEN: ${FD_AGENT_TOKEN:?set FD_AGENT_TOKEN in your .env}
      HOSTNAME: compose-host
    # The image runs as non-root by default (for a rootless Podman socket the
    # user owns). This demo mounts the root Docker socket for convenience, so
    # it overrides to root to read it. Note the socket is root-equivalent and
    # `:ro` does NOT make the Docker API read-only. Production uses rootless
    # Podman and keeps the non-root default. See docs/security.md.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - control-plane
    restart: unless-stopped

  demo:
    image: alpine
    labels:
      flightdeck.enable: 'true'
      flightdeck.service: 'demo-api'
    command: sh -c 'i=0; while true; do echo "demo tick $$i"; i=$$((i+1)); sleep 1; done'
    restart: unless-stopped

  # FULL tier only: the HA store for cross-instance fan-out. Gated by a Compose
  # profile, so lite/medium (and plain `just demo`) never start it. Bring it up
  # with `--profile full` and set FD_DATABASE_URL on the control plane to:
  #   postgres://flightdeck:flightdeck@postgres:5432/flightdeck
  # Durable log search (Loki/Grafana) is the flightdeck-watcher stack, not here.
  postgres:
    image: postgres:17-alpine
    profiles: ['full']
    environment:
      POSTGRES_USER: flightdeck
      POSTGRES_PASSWORD: ${FD_POSTGRES_PASSWORD:-flightdeck}
      POSTGRES_DB: flightdeck
    volumes:
      - flightdeck-pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flightdeck']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flightdeck-pg:
