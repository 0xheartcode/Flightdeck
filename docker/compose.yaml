name: flightdeck-cd

# Demo stack: control plane + web UI + agent + a labelled sample service.
# Run with:  just demo   (or: docker compose -f docker/compose.yaml up --build)

services:
  control-plane:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control-plane
    environment:
      # Required: compose fails fast if unset (no insecure default token).
      FD_AGENT_TOKEN: ${FD_AGENT_TOKEN:?set FD_AGENT_TOKEN in your .env}
      FD_DASHBOARD_TOKEN: ${FD_DASHBOARD_TOKEN:-}
      FD_CORS_ORIGIN: ${FD_CORS_ORIGIN:-http://localhost:8080}
      FD_CONTROL_PLANE_PORT: '4000'
      FD_LOG_BUFFER_SIZE: ${FD_LOG_BUFFER_SIZE:-2000}
    ports:
      - '4000:4000'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - '8080:80'
    depends_on:
      - control-plane
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    environment:
      FD_CONTROL_PLANE_URL: ws://control-plane:4000/agent
      FD_AGENT_TOKEN: ${FD_AGENT_TOKEN:?set FD_AGENT_TOKEN in your .env}
      HOSTNAME: compose-host
    # The agent needs the container socket. This demo mounts the Docker socket
    # for convenience, which is root-equivalent on the host (the `:ro` flag
    # does NOT make the Docker API read-only; it only marks the socket file
    # read-only). In production prefer a rootless Podman socket. See
    # docs/security.md.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - control-plane
    restart: unless-stopped

  demo:
    image: alpine
    labels:
      flightdeck.enable: 'true'
      flightdeck.service: 'demo-api'
    command: sh -c 'i=0; while true; do echo "demo tick $$i"; i=$$((i+1)); sleep 1; done'
    restart: unless-stopped
