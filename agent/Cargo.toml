[package]
name = "flightdeck-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Flightdeck-CD per-server agent: streams container logs and status to the control plane over WebSocket."

[[bin]]
name = "flightdeck-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "process", "io-util"] }
bollard = "0.21"
# "rustls-tls-native-roots" lets the agent connect over wss:// using the OS
# trust store, without an OpenSSL system dependency.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"
