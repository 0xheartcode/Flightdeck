# cargo-deny policy for the Rust agent. Run with `just audit`.
# Advisory ignores and license additions are deliberate, each with a reason.

[advisories]
version = 2
yanked = "deny"
ignore = []

[bans]
# Big dependency trees pull duplicate minor versions transitively; warn, don't deny.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. Add a new one deliberately, with the crate and why.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
]
