[workspace]
resolver = "3"
members = ["agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["0xheartcode"]
repository = "https://github.com/0xheartcode/flightdeck-cd"

[profile.release]
# Small, fast single binary for shipping to servers.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
